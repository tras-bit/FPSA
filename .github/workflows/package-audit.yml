name: package-audit

# Verifies that every package version pinned in Packages/manifest.json really
# exists, and that the editor version in ProjectSettings/ProjectVersion.txt is a
# real Unity release.  The sandbox this project is authored in cannot reach
# packages.unity.com, so the audit runs in CI and commits its report back into
# docs/reports/ (Actions log download hosts are unreachable from the sandbox,
# therefore the report is committed as a file instead of read from the log).

on:
  push:
    paths:
      - "Packages/manifest.json"
      - "ProjectSettings/ProjectVersion.txt"
      - ".github/workflows/package-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Audit pinned versions
        run: |
          mkdir -p docs/reports
          python3 Tools/unity/audit_packages.py \
            --manifest Packages/manifest.json \
            --project-version ProjectSettings/ProjectVersion.txt \
            --markdown docs/reports/package-audit.md \
            --json docs/reports/package-audit.json

      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/package-audit.md docs/reports/package-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Unity package audit report"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "report unchanged"
          fi

      - name: Fail when a pinned version does not exist
        run: |
          if grep -q '^## FAILURES' docs/reports/package-audit.md; then
            echo "One or more pinned versions are unavailable - see docs/reports/package-audit.md"
            exit 1
          fi
          echo "all pinned versions resolve"
