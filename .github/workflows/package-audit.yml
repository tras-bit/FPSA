name: package-audit

# Verifies that every package version pinned in Packages/manifest.json actually
# exists in the Unity package registry, and that the editor version recorded in
# ProjectSettings/ProjectVersion.txt is a real Unity release.  The sandbox used
# to author this project cannot reach packages.unity.com, so the audit runs in
# CI and commits its report back into docs/reports/.

on:
  push:
    paths:
      - "Packages/manifest.json"
      - "ProjectSettings/ProjectVersion.txt"
      - ".github/workflows/package-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Audit pinned versions
        run: |
          mkdir -p docs/reports
          python3 - <<'PY' > docs/reports/package-audit.md
          import json, os, subprocess, sys, re

          def curl(url, timeout=40):
              try:
                  r = subprocess.run(["curl", "-sL", "-m", str(timeout), url],
                                     capture_output=True, text=True)
                  return r.stdout
              except Exception as exc:
                  return ""

          man = json.load(open("Packages/manifest.json"))
          deps = man["dependencies"]
          editor = open("ProjectSettings/ProjectVersion.txt").read().strip()
          editor_version = editor.split(":", 1)[1].strip().splitlines()[0]

          rows, failures = [], []
          for pkg, pinned in sorted(deps.items()):
              if pkg.startswith("com.unity.modules."):
                  rows.append((pkg, pinned, "built-in module (editor-provided, not on registry)"))
                  continue
              body = curl("https://packages.unity.com/" + pkg)
              try:
                  data = json.loads(body)
              except Exception:
                  rows.append((pkg, pinned, "REGISTRY UNREACHABLE / NOT FOUND"))
                  failures.append(pkg)
                  continue
              versions = list(data.get("versions", {}).keys())
              tag = data.get("dist-tags", {})
              if pinned in versions:
                  rows.append((pkg, pinned, "OK  (latest=%s, recommended=%s)" % (tag.get("latest"), tag.get("recommended"))))
              else:
                  rows.append((pkg, pinned, "MISSING - available: " + ", ".join(versions[-12:])))
                  failures.append(pkg)

          print("# Unity package / editor version audit")
          print()
          print("Generated by `.github/workflows/package-audit.yml`.")
          print()
          print("`ProjectSettings/ProjectVersion.txt` -> **%s**" % editor_version)
          print()
          print("| package | pinned | status |")
          print("| --- | --- | --- |")
          for r in rows:
              print("| `%s` | `%s` | %s |" % r)
          print()
          if failures:
              print("## FAILURES")
              for f in failures:
                  print("- %s" % f)
          else:
              print("All pinned package versions exist in the Unity registry.")
          print()

          # editor version cross-check against Unity's public release metadata
          print("## Editor release cross-check")
          print()
          body = curl("https://services.unity.com/api/v1/releases?platform=linux&version=" + editor_version.split("f")[0])
          m = re.findall(r'"version"\s*:\s*"([0-9]{4}\.[0-9]+\.[0-9]+[fp][0-9]+)"', body)
          if m:
              print("services.unity.com reports: " + ", ".join(sorted(set(m))[-15:]))
          else:
              print("services.unity.com did not answer with a version list; raw head:")
              print("```")
              print((body or "(empty)")[:600])
              print("```")
          archive = curl("https://unity.com/releases/editor/archive", 60)
          found = sorted(set(re.findall(r"6000\.0\.[0-9]+f[0-9]+", archive)))
          if found:
              print()
              print("unity.com archive lists Unity 6 LTS: " + ", ".join(found[-12:]))
          PY
          cat docs/reports/package-audit.md

      - name: Commit report (always, CI logs are not readable from the authoring sandbox)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/package-audit.md
          SUMMARY=$(grep -E "^\| \`com" docs/reports/package-audit.md | head -30 | tr "\n" ";" || true)
          if ! git diff --cached --quiet; then
            git commit -m "docs: Unity package audit report" -m "$SUMMARY"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "report unchanged"
          fi

      - name: Fail when a pinned version does not exist
        run: |
          if grep -q "^## FAILURES" docs/reports/package-audit.md; then
            echo "One or more pinned package versions are not available - see docs/reports/package-audit.md"
            exit 1
          fi
