name: core-tests

# Real, executed verification of the game rules.
#
#   job "core"    - compiles Kordon.Core plus the xunit suites with plain
#                   Roslyn/CoreCLR and runs them (50 kill victory, reload and
#                   magazine inspection, ammo hiding, server side scoring,
#                   respawn, match end, damage/penetration, anti-cheat).
#   job "syntax"  - parses every .cs file in Assets/ with Roslyn at C# 9 and
#                   reports syntax errors, duplicate types, asmdef coverage
#                   gaps, engine references inside Kordon.Core, loopback
#                   addresses in networking code and malformed data files.
#   job "game"    - type checks every Unity side script (Game + Editor assemblies)
#                   against hand written UnityEngine/UnityEditor API stubs, so
#                   Unity code is compiled by Roslyn on every push even though the
#                   editor itself cannot run in CI.
#   job "publish" - the only job that pushes: it collects the reports from the
#                   workflow artifacts and commits them in one go, so the
#                   verification jobs can never race each other on the branch.
#
# Reports are committed because the Actions log download host is not reachable
# from the authoring sandbox.

on:
  push:
    paths:
      # The policy job reads the package manifest and the verification tools, so a
      # change to either must re-run the checks it guards.
      - "Assets/_Project/Scripts/**"
      - "Assets/StreamingAssets/**"
      - "Packages/manifest.json"
      - "ProjectSettings/ProjectVersion.txt"
      - "Tools/**"
      - "Tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Kordon.Core and the test suites
        run: |
          set -o pipefail
          dotnet build Tests/Kordon.Core.Tests/Kordon.Core.Tests.csproj -c Release -v minimal 2>&1 | tee /tmp/build.log
      - name: Run rules tests
        run: |
          set -o pipefail
          dotnet test Tests/Kordon.Core.Tests/Kordon.Core.Tests.csproj -c Release --no-build \
            --logger "console;verbosity=detailed" 2>&1 | tee /tmp/test.log
      - name: Write report
        if: always()
        run: |
          mkdir -p docs/reports
          {
            echo "# Kordon.Core automated test report"
            echo
            echo "Generated by \`.github/workflows/core-tests.yml\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "The suite compiles \`Assets/_Project/Scripts/Core\` (no UnityEngine references)"
            echo "together with \`Tests/Kordon.Core.Tests\` and runs it on plain CoreCLR, so the"
            echo "authoritative rules are executed for real: 50 elimination victory, 20 slots,"
            echo "server side scoring, respawn timing, magazine reload/inspect, ammo hiding,"
            echo "damage, penetration, recoil, movement, stamina and the anti-cheat validators."
            echo
            echo "## Summary"
            echo
            echo '```'
            grep -E "(Passed!|Failed!|Total tests|Passed:|Failed:|Skipped:|error |Build succeeded|[0-9]+ Error|[0-9]+ Warning)" /tmp/build.log /tmp/test.log 2>/dev/null | sed 's#/tmp/[a-z]*\.log[:-]##' | head -600
            echo '```'
            echo
            echo "## Every unique compiler error (never truncated)"
            echo
            echo '```'
            grep -oE "error [A-Z]+[0-9]+:.*" /tmp/build.log /tmp/test.log 2>/dev/null | sort -u
            echo '```'
            echo
            echo "## Failed test details"
            echo
            echo '```'
            grep -B 2 -A 18 -E "(Failed |Error Message|Assert\.)" /tmp/test.log 2>/dev/null | head -400
            echo '```'
            echo
            echo "## Build log"
            echo
            echo '```'
            tail -200 /tmp/build.log 2>/dev/null
            echo '```'
            echo
            echo "## Test log (tail)"
            echo
            echo '```'
            tail -250 /tmp/test.log 2>/dev/null
            echo '```'
          } > docs/reports/core-tests.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-core
          path: docs/reports/core-tests.md
          if-no-files-found: error

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Roslyn syntax and structure gate
        run: |
          mkdir -p docs/reports
          set +e
          dotnet run --project Tests/Kordon.SyntaxCheck/Kordon.SyntaxCheck.csproj -c Release -- \
            --root . --report docs/reports/syntax-report.md > /tmp/syntax.log 2>&1
          code=$?
          set -e
          if [ ! -f docs/reports/syntax-report.md ]; then
            echo "# Roslyn syntax and project structure report" > docs/reports/syntax-report.md
            echo >> docs/reports/syntax-report.md
            echo "The gate itself did not produce a report; raw output follows." >> docs/reports/syntax-report.md
          fi
          {
            echo
            echo "## Gate output"
            echo
            echo '```'
            tail -300 /tmp/syntax.log
            echo '```'
          } >> docs/reports/syntax-report.md
          exit $code
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-syntax
          path: docs/reports/syntax-report.md
          if-no-files-found: error

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the structural design rules
        run: python3 Tools/verify/policy_check.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-policy
          path: docs/reports/policy.md
          if-no-files-found: error

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Type check Unity side code against the API stubs
        run: |
          set -o pipefail
          dotnet build Tests/Kordon.Game.CompileCheck/Kordon.Game.CompileCheck.csproj \
            -c Release -v minimal 2>&1 | tee /tmp/game.log
      - name: Write report
        if: always()
        run: |
          mkdir -p docs/reports
          {
            echo "# Unity side compile check report"
            echo
            echo "Generated by \`.github/workflows/core-tests.yml\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Unity cannot run in CI, so \`Tests/Kordon.Game.CompileCheck\` compiles"
            echo "\`Assets/_Project/Scripts/{Core,Game,Editor}\` with Roslyn against hand written"
            echo "UnityEngine/UnityEditor stubs (\`Stubs/*.cs\`, real Unity 6000.0 signatures)."
            echo "This catches typos, wrong signatures and missing members in the Unity side"
            echo "code on every push; the editor import then only resolves assets."
            echo
            echo "## Summary"
            echo
            echo '```'
            grep -E "(error |Build succeeded|[0-9]+ Error|[0-9]+ Warning)" /tmp/game.log 2>/dev/null | head -300
            echo '```'
            echo
            echo "## Every unique compiler error (never truncated)"
            echo
            echo '```'
            grep -oE "error [A-Z]+[0-9]+:.*" /tmp/game.log 2>/dev/null | sort -u
            echo '```'
            echo
            echo "## Build log"
            echo
            echo '```'
            tail -200 /tmp/game.log 2>/dev/null
            echo '```'
          } > docs/reports/game-compile.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-game
          path: docs/reports/game-compile.md
          if-no-files-found: error

  publish:
    needs: [core, syntax, policy, game]
    # Reports are committed to the branch.  A tag build verifies the same commit
    # that was already green on the branch, and a tag ref cannot be pushed to, so
    # publishing is skipped there instead of failing the release.
    if: always() && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: /tmp/reports
          merge-multiple: true
      - name: Commit reports
        run: |
          mkdir -p docs/reports
          cp -f /tmp/reports/*.md docs/reports/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/core-tests.md docs/reports/syntax-report.md docs/reports/game-compile.md docs/reports/policy.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh core test and syntax reports"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
