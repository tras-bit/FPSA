name: core-tests

# Real, executed verification of the game rules.
#
#   job "core"   - compiles Kordon.Core with plain Roslyn/CoreCLR and runs the
#                  xunit suite (50 kill victory, reload, inspect, ammo hiding,
#                  server side scoring, respawn, match end, damage, anti-cheat).
#   job "syntax" - parses every .cs file in Assets/ with Roslyn and reports
#                  syntax errors, duplicate types and asmdef coverage gaps.
#
# Both jobs write docs/reports/*.md and commit them, because the Actions log
# download host is not reachable from the authoring sandbox.

on:
  push:
    paths:
      - "Assets/_Project/Scripts/**"
      - "Assets/StreamingAssets/**"
      - "Tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Kordon.Core
        run: dotnet build Tests/Kordon.Core.Tests/Kordon.Core.Tests.csproj -c Release -v minimal 2>&1 | tee /tmp/build.log
      - name: Run rules tests
        run: |
          set -o pipefail
          dotnet test Tests/Kordon.Core.Tests/Kordon.Core.Tests.csproj -c Release --no-build \
            --logger "trx;LogFileName=core.trx" --logger "console;verbosity=normal" 2>&1 | tee /tmp/test.log
      - name: Write report
        if: always()
        run: |
          mkdir -p docs/reports
          {
            echo "# Kordon.Core automated test report"
            echo
            echo "Generated by \`.github/workflows/core-tests.yml\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo '```'
            grep -E "^(Build succeeded| *[0-9]+ Warning| *[0-9]+ Error|Passed!|Failed!|  Passed |  Failed |  Skipped |Total tests|error |warning )" /tmp/build.log /tmp/test.log | sed 's#/tmp/[a-z]*\.log[:-]##' | head -200
            echo '```'
            echo
            echo '## Failed test details'
            echo
            echo '```'
            grep -A 12 -E "^\s+(Failed|Error Message)" /tmp/test.log | head -300 || true
            echo '```'
          } > docs/reports/core-tests.md
          grep -E "Passed!|Failed!|Total tests|error CS" /tmp/build.log /tmp/test.log | head -20 || true
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/core-tests.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh core test report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Roslyn syntax + structure gate
        run: |
          set -o pipefail
          dotnet run --project Tests/Kordon.SyntaxCheck/Kordon.SyntaxCheck.csproj -c Release -- \
            --root . --report docs/reports/syntax-report.md 2>&1 | tee /tmp/syntax.log
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/syntax-report.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Roslyn syntax report"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
