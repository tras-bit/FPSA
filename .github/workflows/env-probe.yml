name: env-probe
on: push
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: Unity package registry versions
        run: |
          for pkg in com.unity.netcode.gameobjects com.unity.transport com.unity.test-framework com.unity.ugui com.unity.nuget.newtonsoft-json com.unity.inputsystem com.unity.ai.navigation com.unity.cinemachine com.unity.timeline com.unity.shadergraph com.unity.render-pipelines.universal com.unity.textmeshpro; do
            echo "=== $pkg ==="
            curl -s -m 25 "https://packages.unity.com/$pkg" \
              | jq -r '"  dist-tags: \(.["dist-tags"])", "  last 14: \(.versions | keys_unsorted | .[-14:] | join(", "))"' \
              || echo "  (unavailable)"
          done
      - name: Unity editor LTS versions
        run: |
          echo "=== unity archive page ==="
          curl -sL -m 60 "https://unity.com/releases/editor/archive" \
            | grep -oE "6000\.[0-9]+\.[0-9]+[fp][0-9]+" | sort -u | tail -30 || true
          echo "=== public cdn linux releases ==="
          curl -sL -m 40 "https://public-cdn.cloud.unity3d.com/linux/editor-releases/" | head -c 300 || true
          echo
          echo "=== unity releases api ==="
          curl -sL -m 40 "https://services.unity.com/api/v1/releases" | head -c 800 || true
